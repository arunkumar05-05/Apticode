services:
  - type: web
    name: apticode-api
    region: oregon
    plan: web_free
    runtime: node
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: true
      - key: CORS_ORIGINS
        value: https://apticode.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: apticode-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: apticode-cache
          property: connectionString
      - key: JWT_SECRET
        sync: false            # set as a secret in the Render dashboard
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://vsllm.com/v1
      - key: AI_MODEL
        value: glm-4.7-flash-free
      - key: EMAIL_DEV_TRANSPORT
        value: false
      - key: SMTP_HOST        # set as secret
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

  - type: worker
    name: apticode-worker
    region: oregon
    plan: worker_free
    runtime: node
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: apticode-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: apticode-cache
          property: connectionString
      - key: JUDGE0_API_URL
        sync: false            # set as a secret in the Render dashboard
      - key: JUDGE0_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false

databases:
  - name: apticode-db
    region: oregon
    plan: postgres_production

redis:
  - name: apticode-cache
    region: oregon
    plan: redis_free

# Add these secrets via the Render dashboard (never in this file):
#   JWT_SECRET, AI_API_KEY, SMTP_HOST, SMTP_PASS, SMTP_USER, CLOUDINARY_*
