services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: apticode/server:latest
    env_file: .env
    ports:
      - '5001:5001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:5001/health",r=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apticode
      POSTGRES_PASSWORD: apticode
      POSTGRES_DB: apticode
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apticode']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --save "" --appendonly no
    ports:
      - '6379:6379'

  # Phase 5 — BullMQ code-execution worker (same image as the API, different entrypoint)
  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: apticode/server:latest
    env_file: .env
    command: ['node', 'dist/worker/index.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Optional local Judge0 CE runner (no auth by default):
  #   docker compose --profile judge0 up -d
  judge0:
    image: judge0/judge0-ce:1.13.0
    profiles: ['judge0']
    command: ./bin/rails server -p 2358
    ports:
      - '2358:2358'
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: dev-secret-key-base-change-me
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: apticode
      POSTGRES_PASSWORD: apticode
      POSTGRES_DB: apticode
      JUDGE0_DAEMON_PROCESSES: '4'
      JUDGE0_MAX_QUEUE_SIZE: '100'
      JUDGE0_ENABLE_WAIT: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pg_data:
