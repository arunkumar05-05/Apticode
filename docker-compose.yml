services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: apticode/server:latest
    env_file: .env
    ports:
      - '5001:5001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:5001/health",r=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apticode
      POSTGRES_PASSWORD: apticode
      POSTGRES_DB: apticode
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apticode']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --save "" --appendonly no
    ports:
      - '6379:6379'

volumes:
  pg_data:
