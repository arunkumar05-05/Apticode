name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apticode
          POSTGRES_PASSWORD: apticode
          POSTGRES_DB: apticode_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apticode"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prisma
            /tmp/prisma-engines
          key: ${{ runner.os }}-prisma-${{ hashFiles('server/prisma/**') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Install (server)
        run: npm ci

      - name: Prisma generate + validate
        run: npx prisma generate && npx prisma validate

      - name: Environment
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://apticode:apticode@localhost:5432/apticode_dev" >> $GITHUB_ENV
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "JWT_ACCESS_EXPIRES_IN=15m" >> $GITHUB_ENV
          echo "JWT_REFRESH_EXPIRES_IN=7d" >> $GITHUB_ENV
          echo "BCRYPT_SALT_ROUNDS=10" >> $GITHUB_ENV
          echo "AI_API_KEY=sk-placeholder-test" >> $GITHUB_ENV
          echo "AI_API_URL=https://vsllm.com/v1" >> $GITHUB_ENV
          echo "AI_MODEL=glm-4.7-flash-free" >> $GITHUB_ENV
          echo "SMTP_DEV_TRANSPORT=true" >> $GITHUB_ENV
          # create schema + run migrations against the service DB
        env:
          DATABASE_URL: postgresql://apticode:apticode@localhost:5432/apticode_dev

      - name: Migrate
        run: npx prisma migrate deploy || npx prisma migrate dev --name ci_init

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Tests
        run: npx jest --forceExit --runInBand
        env:
          DATABASE_URL: postgresql://apticode:apticode@localhost:5432/apticode_dev

      - name: Build Docker image (smoke)
        run: docker build -t apticode-server -f server/Dockerfile .
